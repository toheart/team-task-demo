name: spec-driven-custom
version: 2
description: Go + React 定制 — proposal → specs → design → tasks，tasks 含复杂度分级与执行约束
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Create the proposal document that establishes WHY this change is needed.


      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does
      this solve? Why now?

      - **What Changes**: Bullet list of changes. Be specific about new
      capabilities, modifications, or removals. Mark breaking changes with
      **BREAKING**.

      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      - **Ubiquitous Language**: New or changed domain terms with Chinese name,
      English name, definition, and DDD building block type. Write "无" when
      there are none.


      IMPORTANT: The Capabilities section is critical. It creates the contract
      between proposal and specs phases. Research existing specs before filling
      this in. Each capability listed here will need a corresponding spec file.


      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.


      This is the foundation - specs, design, and tasks all build on this.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: >
      Create specification files that define WHAT the system should do.


      Create one spec file per capability listed in the proposal's Capabilities
      section.

      - New capabilities: use the exact kebab-case name from the proposal
      (specs/<capability>/spec.md).

      - Modified capabilities: use the existing spec folder name from
      openspec/specs/<capability>/ when creating the delta spec at
      specs/<capability>/spec.md.


      Delta operations (use ## headers):

      - **ADDED Requirements**: New capabilities

      - **MODIFIED Requirements**: Changed behavior - MUST include full updated
      content

      - **REMOVED Requirements**: Deprecated features - MUST include **Reason**
      and **Migration**

      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format


      Format requirements:

      - Each requirement: `### Requirement: <name>` followed by description

      - Use MUST/SHALL for normative requirements (avoid should/may)

      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format

      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3
      hashtags or bullets will fail silently.

      - Every requirement MUST have at least one scenario.


      MODIFIED requirements workflow:

      1. Locate the existing requirement in openspec/specs/<capability>/spec.md

      2. Copy the ENTIRE requirement block (from `### Requirement:` through all
      scenarios)

      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior

      4. Ensure header text matches exactly (whitespace-insensitive)


      Common pitfall: Using MODIFIED with partial content loses detail at
      archive time. If adding new concerns without changing existing behavior,
      use ADDED instead.


      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design with affected ends, acceptance matrix, anti-patterns and review checklist
    template: design.md
    instruction: >
      Create the design document that explains HOW to implement the change.


      Sections:

      - **Context**: Background, current state, constraints, stakeholders

      - **Goals / Non-Goals**: What this design achieves and explicitly excludes

      - **影响端与验收契约** (REQUIRED): Fill the `affected_ends` YAML block
      (backend / frontend / external_systems) and the acceptance matrix. Every
      P0/P1 scenario needs a user-observable acceptance behavior and a suggested
      minimum test layer chosen from: unit / component / app / api-smoke /
      integration / browser-ui / e2e. Select the layer only - do not name test
      files. Mark each acceptance row with priority P0, P1 or P2. When automation is not yet possible, record the manual or gray
      verification approach and the reason.

      - **Decisions**: Key technical choices with rationale (why X over Y?).
      Include alternatives considered for each decision.

      - **Risks / Trade-offs**: Known limitations, things that could go wrong.
      Format: [Risk] → Mitigation


      **REQUIRED section — 实现反模式（SubAgent 必读）**:

      A numbered list of things that MUST NOT be done during implementation.
      This section is the hard constraint for the executing SubAgent, not advice.
      Focus on: architectural constraints that are easy to violate; patterns that
      look correct but break invariants; dependencies that must not be modified;
      generated files that must not be hand-edited.


      **REQUIRED section — Review Checklist（本次变更专用）**:

      A checklist of verification items specific to this change. Each item must
      be a concrete yes/no question that a code reviewer can check mechanically.
      This converts free-form review into deterministic checklist verification.
      Do not write unverifiable items such as "code quality is good".
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with complexity grading, constraints, and verification
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      **IMPORTANT: Follow the template structure exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      ## Complexity Grading

      Every task MUST be tagged with a complexity level in the heading:

      | Level | Description | Documentation Depth | SubAgent Behavior |
      |-------|------------|--------------------|--------------------|
      | **[L1]** | Simple (change constant, add field, delete code) | One line: locator + action + done state + verification | Almost never fails |
      | **[L2]** | Standard (CRUD, new method, call chain wiring) | Locator + implementation chain + DoD + verification | Occasional boundary miss |
      | **[L3]** | Complex (state machine, concurrency, cross-package, protocol/replay safety) | Pseudo-code + constraint checklist + anti-pattern list | Frequently drifts |

      If a change has more than 30% L3 tasks, the design decomposition is
      insufficient — go back to design.md and break them down further.

      ## Task Structure

      Put shared prerequisites, contract anchors, boundaries, and commands once
      under the task group. Tasks may reference command IDs such as `V-BE`.
      Do not repeat group context in every task.

      **L1 tasks** — exactly one line:
      ```
      - [ ] 1.1 [L1] [后端] `internal/domain/sample/sample.go#Sample`：新增 Status 字段并保持零值语义；验证 V-BE
      ```

      **L2 tasks** — three compact detail lines:
      ```
      - [ ] 2.1 [L2] [后端] `internal/application/sample/service.go#List`：实现按状态过滤
        - **实现**: 校验 filter → repository.List → DTO 转换；契约 `specs/sample-list/spec.md#Scenario: Successful list`
        - **DoD**: 合法输入返回 DTO；非法输入返回 INVALID_PARAMS；不修改仓储接口
        - **验证**: `go test ./internal/application/sample/...`
      ```

      **L3 tasks** — full detail with constraints and stop conditions:
      ```
      - [ ] 3.1 [L3] [前端] `frontend/src/hooks/useSampleQuery.ts#useSampleQuery`：实现请求竞态防护
        - **前置/契约**: 2.3；`design.md#请求竞态决策`
        - **步骤**:
          1. 在 effect 内创建 AbortController 并在 cleanup 中 abort
          2. 用请求序号丢弃过期响应，不依赖调用顺序
        - **架构约束（必须遵守）**:
          - effect cleanup 必须幂等：React StrictMode 下会双调用
          - 不要在 render 阶段发起请求
          - 不要修改 `src/services/api.ts` 的公共签名
        - **DoD**: 快速切换筛选条件时只呈现最后一次结果
        - **停手条件**: 现有 API 无法取消请求时停止并报告
        - **验证**: `npm test -- useSampleQuery`
      ```

      ## Guidelines

      - Group related tasks under `## N. Group Name`
      - Each task MUST be a checkbox: `- [ ] X.Y [LN] [端别] Task description`
      - Use only `[共享]`, `[后端]`, `[前端]`, or `[联调]` as the endpoint tag
      - 跨端任务按共享契约 → 后端 → 前端 → 联调排序；纯单端只保留实际分组
      - Tasks should be small enough to complete in one session; one task has one owner
      - Order tasks by dependency (what must be done first?)
      - Define shared prerequisites, contract anchors, boundaries, and validation
        commands once per group; individual tasks reference them instead of repeating
      - L1 MUST stay on one line; L2 SHOULD use only implementation, DoD, and
        verification detail lines; only L3 gets full steps and constraints
      - Every task MUST retain its endpoint tag, exact file/symbol locator, one
        observable outcome, and a verification entry
      - New files MUST name their parent directory and integration point;
        existing symbols MUST be verified from code
      - State the generic stop rule once per file/group: stop and report when code
        facts conflict with design, a contract is missing, or scope would expand
      - Do not repeat design rationale or global anti-patterns; cite exact
        spec/design anchors and list only task-specific constraints
      - Do not use TBD, optional alternatives, "按实际情况", or ask the executor
        to decide architecture, error semantics, file placement, or cross-end contracts
      - If one task spans multiple owners, independent call chains, or independently
        verifiable outcomes, split it before finishing tasks.md
      - L3 tasks MUST include **架构约束** and task-specific **停手条件**
      - Every task group SHOULD end with a verification task (`go build` / `go test` / `npm run build`)
      - Reference specs for what needs to be built, design for how to build it
      - Reference design.md's anti-pattern section in L3 task constraints
    requires:
      - specs
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
